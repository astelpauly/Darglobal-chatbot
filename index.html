<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dar Global — Property Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg:          #0b0b0c;
    --bg-panel:    #121214;
    --bg-elev:     #1a1a1d;
    --border:      #2a2a2e;
    --border-soft: #1f1f22;
    --fg:          #f3f1ec;
    --fg-muted:    #8a867d;
    --gold:        #c9a96a;
    --gold-soft:   #a88c4e;
    --user-bg:     #1c1c20;
    --bot-bg:      transparent;
    --serif:       'Cormorant Garamond', 'Times New Roman', serif;
    --sans:        'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    padding: 28px 40px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .brand {
    display: flex; align-items: baseline; gap: 14px;
    max-width: 1100px; margin: 0 auto;
  }
  .brand .logo {
    font-family: var(--serif);
    font-size: 28px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .brand .logo span { color: var(--gold); }
  .brand .divider {
    width: 1px; height: 22px; background: var(--border); margin: 0 4px;
  }
  .brand .tag {
    font-family: var(--sans); font-size: 11px; font-weight: 400;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* ---------- chat area ---------- */
  main {
    flex: 1; overflow-y: auto; padding: 36px 24px 180px;
  }
  .conv { max-width: 820px; margin: 0 auto; }

  .msg { margin: 26px 0; display: flex; flex-direction: column; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .msg .who {
    font-family: var(--sans); font-size: 10px; font-weight: 500;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  .msg.user .who { color: var(--fg-muted); }
  .msg .body {
    font-family: var(--sans); font-size: 15.5px; line-height: 1.75;
    color: var(--fg); max-width: 100%;
  }
  .msg.user .body { white-space: pre-wrap; }
  /* markdown styling inside bot answers */
  .msg .body p             { margin: 0 0 10px; }
  .msg .body p:last-child  { margin-bottom: 0; }
  .msg .body strong        { color: var(--fg); font-weight: 500; }
  .msg .body em            { color: var(--gold); font-style: italic; }
  .msg .body ul, .msg .body ol { margin: 6px 0 10px; padding-left: 22px; }
  .msg .body li            { margin: 3px 0; }
  .msg .body ul li::marker { color: var(--gold); }
  .msg .body h1, .msg .body h2, .msg .body h3 {
    font-family: var(--serif); font-weight: 400;
    margin: 14px 0 8px; color: var(--fg);
  }
  .msg .body h1 { font-size: 22px; } .msg .body h2 { font-size: 19px; } .msg .body h3 { font-size: 17px; }
  .msg .body code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    background: var(--bg-elev); padding: 1px 6px; border-radius: 2px;
  }
  .msg .body table {
    border-collapse: collapse; margin: 10px 0; width: 100%;
  }
  .msg .body th, .msg .body td {
    border-bottom: 1px solid var(--border-soft); padding: 6px 10px; text-align: left;
  }
  .msg .body th { color: var(--gold); font-weight: 500; }
  .msg .body hr { border: 0; border-top: 1px solid var(--border-soft); margin: 14px 0; }
  .msg .body blockquote {
    border-left: 2px solid var(--gold); padding-left: 12px;
    color: var(--fg-muted); margin: 10px 0;
  }
  .msg.user .body {
    background: var(--user-bg); border: 1px solid var(--border-soft);
    padding: 16px 20px; border-radius: 2px;
  }
  .msg .body a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-soft); }
  .msg .body a:hover { color: var(--fg); border-color: var(--fg); }

  .msg.user { align-items: flex-end; }
  .msg.user .body { max-width: 75%; }

  .welcome {
    text-align: center; padding: 70px 20px 40px;
    border-bottom: 1px solid var(--border-soft); margin-bottom: 20px;
  }
  .welcome h2 {
    font-family: var(--serif); font-size: 38px; font-weight: 300;
    letter-spacing: 0.04em; margin: 0 0 14px; color: var(--fg);
  }
  .welcome h2 em { font-style: italic; color: var(--gold); font-weight: 400; }
  .welcome p {
    color: var(--fg-muted); max-width: 540px; margin: 0 auto 28px;
    font-size: 14px; letter-spacing: 0.02em;
  }
  .suggests {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    max-width: 680px; margin: 0 auto;
  }
  .suggests button {
    background: transparent; border: 1px solid var(--border);
    color: var(--fg); font-family: var(--sans); font-size: 12.5px;
    padding: 10px 18px; border-radius: 2px; cursor: pointer;
    letter-spacing: 0.04em; transition: all .2s;
  }
  .suggests button:hover {
    border-color: var(--gold); color: var(--gold);
  }

  /* ---------- sources ---------- */
  .sources {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft);
    font-size: 12px; letter-spacing: 0.04em;
  }
  .sources .label {
    color: var(--gold); font-weight: 500; letter-spacing: 0.2em;
    text-transform: uppercase; font-size: 10px; margin-bottom: 8px;
    display: block;
  }
  .sources a {
    display: block; color: var(--fg-muted); border-bottom: none;
    margin: 4px 0; padding: 4px 0; font-size: 12.5px;
  }
  .sources a:hover { color: var(--gold); }
  .sources a .num { color: var(--gold); margin-right: 8px; font-weight: 500; }

  /* ---------- typing ---------- */
  .typing { color: var(--fg-muted); font-style: italic; }
  .dots::after {
    content: '•'; animation: dots 1.4s infinite;
    display: inline-block; margin-left: 4px;
  }
  @keyframes dots {
    0%,20%   { content: '•  '; }
    40%      { content: '•• '; }
    60%,100% { content: '•••'; }
  }

  /* ---------- input bar ---------- */
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 70%, rgba(11,11,12,0));
    padding: 20px 24px 28px;
  }
  .input-wrap {
    max-width: 820px; margin: 0 auto;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 2px; padding: 4px; display: flex; gap: 2px;
    transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--gold-soft); }
  textarea {
    flex: 1; background: transparent; border: 0; outline: none;
    color: var(--fg); font-family: var(--sans); font-size: 15px;
    padding: 14px 16px; resize: none; max-height: 140px; min-height: 48px;
    font-weight: 300;
  }
  textarea::placeholder { color: var(--fg-muted); }
  button#send {
    background: var(--gold); color: #0b0b0c;
    border: 0; padding: 0 18px; min-width: 52px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 2px;
    transition: background .2s;
  }
  button#send:hover:not(:disabled) { background: var(--fg); }
  button#send:disabled { opacity: 0.4; cursor: default; }
  .hint {
    max-width: 820px; margin: 10px auto 0;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-muted); text-align: center;
  }

  /* ---------- Arabic ---------- */
  .rtl { direction: rtl; text-align: right; }
  .rtl .body { font-family: 'Cairo', 'Tajawal', var(--sans); font-size: 16px; }

  @media (max-width: 600px) {
    header { padding: 20px 20px 16px; }
    .brand .logo { font-size: 22px; }
    .brand .tag { display: none; }
    .welcome h2 { font-size: 28px; }
    main { padding: 20px 16px 180px; }
    .msg.user .body { max-width: 90%; }
    footer { padding: 14px 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">DAR <span>GLOBAL</span></div>
    <div class="divider"></div>
    <div class="tag">Property Assistant</div>
  </div>
</header>

<main>
  <div class="conv" id="chat">
    <div class="welcome" id="welcome">
      <h2>Discover <em>luxury</em> redefined</h2>
      <p>Your private concierge for Dar Global residences, partners, and press.
         Ask about any project, location, amenity, or availability — in English or العربية.</p>
      <div class="suggests">
        <button>Tell me about The Mulliner, London</button>
        <button>Projects in Oman</button>
        <button>What is AIDA?</button>
        <button>ما هي مشاريع دار جلوبال في السعودية؟</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="input-wrap">
    <textarea id="q" placeholder="Ask about a project, location, or partner…" rows="1"></textarea>
    <button id="send" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </div>
</footer>

<script>
const chat    = document.getElementById("chat");
const q       = document.getElementById("q");
const send    = document.getElementById("send");
const welcome = document.getElementById("welcome");
const history = [];
const AR = /[؀-ۿ]/;

function msg(role, text, sources) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (AR.test(text)) d.classList.add("rtl");

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "You" : "Dar Global";
  d.appendChild(who);

  const body = document.createElement("div");
  body.className = "body";
  if (role === "assistant" && window.marked) {
    // render Markdown safely (sanitize so nothing malicious can inject HTML)
    marked.setOptions({ breaks: true, gfm: true });
    body.innerHTML = DOMPurify.sanitize(marked.parse(text));
  } else {
    body.textContent = text;
  }
  d.appendChild(body);

  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "Sources";
    s.appendChild(label);
    sources.forEach(src => {
      const a = document.createElement("a");
      a.href = src.url; a.target = "_blank"; a.rel = "noopener";
      const n = document.createElement("span");
      n.className = "num"; n.textContent = "0" + src.n;
      a.appendChild(n);
      a.appendChild(document.createTextNode(
        (src.title || src.url) + (src.section ? " — " + src.section : "")
      ));
      s.appendChild(a);
    });
    body.appendChild(s);
  }
  chat.appendChild(d);
  chat.parentElement.scrollTop = chat.parentElement.scrollHeight;
  return d;
}

function typing() {
  const d = msg("assistant", "");
  d.querySelector(".body").innerHTML = '<span class="typing dots">Searching the archive</span>';
  return d;
}

async function ask(text) {
  text = (text || q.value).trim();
  if (!text) return;
  if (welcome) { welcome.remove(); }
  q.value = ""; q.style.height = "auto";
  send.disabled = true;
  msg("user", text);
  const wait = typing();
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const j = await r.json();
    wait.remove();
    if (j.error) msg("assistant", "I could not answer: " + j.error);
    else {
      msg("assistant", j.answer, j.sources);
      history.push({role: "user", content: text});
      history.push({role: "assistant", content: j.answer});
    }
  } catch (e) {
    wait.remove();
    msg("assistant", "Network error: " + e.message);
  }
  send.disabled = false;
  q.focus();
}

send.onclick = () => ask();
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
});
document.querySelectorAll(".suggests button").forEach(b => {
  b.onclick = () => ask(b.textContent);
});
</script>
</body>
</html>
